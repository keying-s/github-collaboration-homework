name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ember-protocol/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ember-protocol
      - name: Test
        run: npm test
        working-directory: ember-protocol
      - name: Build
        run: npm run build
        working-directory: ember-protocol
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ember-protocol/dist
      - id: deployment
        uses: actions/deploy-pages@v4

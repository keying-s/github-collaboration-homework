name: Game CI

on:
  pull_request:
    paths:
      - "ember-protocol/**"
      - ".github/workflows/game-ci.yml"
      - ".gitattributes"
  push:
    branches: [main]
    paths:
      - "ember-protocol/**"
      - ".github/workflows/game-ci.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ember-protocol
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ember-protocol/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test gameplay
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Check formatting
        run: npm run format:check
